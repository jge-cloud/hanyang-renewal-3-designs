<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한양소재 메인 시안 01–05</title><link rel="icon" href="data:,">
<style>
@font-face{font-family:"Pretendard";src:url("assets/PretendardVariable.woff2") format("woff2-variations");font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:Pretendard,system-ui,sans-serif;background:#1b1d1c;color:#eee;display:flex;flex-direction:column}
.tb{flex:none;display:flex;align-items:center;gap:16px;height:60px;padding:0 16px;background:#111312;border-bottom:1px solid #2c2f2d;overflow-x:auto;white-space:nowrap}
.tb .t{font-weight:700;font-size:14px}.tb .t small{display:block;font-weight:400;font-size:11px;color:#9aa09c}
.tb nav{display:flex;gap:4px}
.tb nav a{display:flex;flex-direction:column;justify-content:center;height:44px;padding:0 14px;border-radius:6px;text-decoration:none;color:#c9ceca;font-size:12px;line-height:1.25}
.tb nav a b{font-size:13px;color:#fff}.tb nav a:hover{background:#232624}
.tb nav a[aria-current=page]{background:#fff;color:#333}.tb nav a[aria-current=page] b{color:#111}
.tb .w{display:flex;gap:2px;margin-left:auto}.tb .w button{background:#232624;color:#ddd;border:0;font:inherit;font-size:12px;padding:8px 10px;border-radius:6px;cursor:pointer}.tb .w button[aria-pressed=true]{background:#fff;color:#111}
.tb .act a{color:#fff;font-size:12px;text-decoration:none;border:1px solid #3a3e3b;border-radius:6px;padding:8px 12px}.tb .act a:hover{background:#232624}
main{flex:1;display:flex;justify-content:center;background:#2a2d2b;min-height:0}
iframe{border:0;width:100%;height:100%;background:#fff}
:focus-visible{outline:2px solid #7fc495;outline-offset:2px}
</style></head><body>
<header class="tb" aria-label="시안 비교"><div class="t">한양소재 메인 시안<small>2026.11</small></div>
<nav aria-label="시안 선택"><a href="?c=1" data-c="1" data-src="s01/index.html"><b>시안 01</b><span>와이드 스토리</span></a><a href="?c=2" data-c="2" data-src="s02/index.html"><b>시안 02</b><span>블루 밸런스</span></a><a href="?c=3" data-c="3" data-src="s03/index.html"><b>시안 03</b><span>부품 탐색</span></a><a href="?c=4" data-c="4" data-src="s04/index.html"><b>시안 04</b><span>웜 머티리얼</span></a><a href="?c=5" data-c="5" data-src="s05/index.html"><b>시안 05</b><span>테크니컬 인덱스</span></a></nav>
<div class="w" role="group" aria-label="미리보기 폭"><button type="button" data-w="100%" aria-pressed="true">데스크톱</button><button type="button" data-w="390px" aria-pressed="false">모바일</button></div>
<div class="act"><a id="solo" href="s01/index.html" target="_blank" rel="noopener">단독 보기 ↗</a></div></header>
<main><iframe id="pv" title="시안 미리보기" src="s01/index.html"></iframe></main>
<script>
(function(){var links=[].slice.call(document.querySelectorAll('.tb nav a')),pv=document.getElementById('pv'),solo=document.getElementById('solo');
function go(n,push){var a=links.filter(function(x){return x.dataset.c==n})[0]||links[0];links.forEach(function(x){if(x===a)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});pv.src=a.dataset.src;solo.href=a.dataset.src;pv.title='시안 0'+a.dataset.c+' 미리보기';if(push)history.pushState(null,'','?c='+a.dataset.c);}
links.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();go(a.dataset.c,true);});});
addEventListener('popstate',function(){go(new URLSearchParams(location.search).get('c')||1,false);});
go(new URLSearchParams(location.search).get('c')||1,false);
document.querySelectorAll('.w button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.w button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});pv.style.width=b.dataset.w;});});})();
</script></body></html>
